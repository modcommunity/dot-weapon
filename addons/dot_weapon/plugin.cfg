[plugin]

name="dot-weapon"
description="Weapons as a catalogue of documents that name a behaviour script by path: guns, bows, melee, thrown, beams and anything a game writes itself, without forking the addon. Deterministic in every input so a client and a server agree, and it never applies damage of its own. Depends on dot-core and dot-combat."
author="dot"
version="0.1.0"
script="dot_weapon_plugin.gd"
